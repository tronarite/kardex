services:
  hub:
    build: .
    container_name: linkhub-nerv
    restart: unless-stopped
    ports:
      - "8090:80"
    # Monta la carpeta completa: edita cualquier archivo dentro de public/
    # (sobre todo config.js) y guarda — el cambio se ve al recargar la
    # pestaña del navegador, sin reconstruir la imagen.
    # (Importante: se monta la CARPETA, no archivos sueltos — montar
    # archivos individuales es frágil en Docker Desktop para Mac/Windows,
    # porque al guardar tu editor puede recrear el archivo con un inodo
    # nuevo y el punto de montaje se queda apuntando a un archivo borrado.)
    #
    # Sin ":ro" (lectura-escritura): el propio contenedor escribe en
    # index.html/robots.txt/sitemap.xml/ld.json al sincronizar las
    # etiquetas de SEO/redes desde config.js — ver
    # scripts/docker-entrypoint-meta.sh. Sigue siendo tu carpeta local de
    # siempre, solo que ahora el contenedor también puede escribir en ella.
    volumes:
      - ./public:/usr/share/nginx/html
