<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>404 — Página no encontrada</title>
  <meta name="robots" content="noindex">

  <!-- Debe coincidir con el theme-color de index.html (ver comentario allí) -->
  <meta name="theme-color" content="#E6EBF7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D131C" media="(prefers-color-scheme: dark)">

  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=5">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">

  <!-- Evita el parpadeo de tema al recargar cuando hay una preferencia manual
       guardada. Externo (no inline) por CSP, ver theme-init.js. -->
  <script src="theme-init.js"></script>
</head>
<body>
  <main class="error-shell">
    <span class="error-code">404</span>
    <h1 class="error-title">Página no encontrada</h1>
    <p class="error-desc">El enlace al que has llegado no existe o se ha movido.</p>
    <a href="/" class="error-link">← Volver al índice</a>
  </main>

  <!-- Solo para aplicar el mismo tema de color elegido en config.js -->
  <script src="config.js"></script>
  <script src="404-theme.js"></script>
</body>
</html>
