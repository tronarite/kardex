<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <!-- Título, meta tags y la imagen de previsualización se generan solos
       desde config.js con Docker (ver scripts/sync-meta.js) — no los
       edites aquí a mano, se sobrescriben. Los valores de abajo son solo
       la plantilla genérica que ves antes de la primera sincronización. -->
  <title>Tu Nombre — Índice personal</title>
  <meta name="description" content="Índice personal de proyectos y enlaces de Tu Nombre / Alias. DESARROLLO SOFTWARE · INGENIERÍA & SISTEMAS.">
  <meta name="robots" content="index, follow">
  <meta name="author" content="Tu Nombre / Alias">
  <!-- Debe coincidir con --light-bg / --dark-bg del theme-pack activo en
       style.css (SITE_CONFIG.theme en config.js) — no se puede calcular en
       CSS, así que si cambias de tema actualiza esto a mano. Valores
       actuales: "azul". -->
  <meta name="theme-color" content="#E6EBF7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D131C" media="(prefers-color-scheme: dark)">

  <!-- Open Graph / Twitter. og:image / twitter:image llevan la URL
       absoluta (la rellena sync-meta.js desde siteUrl) — varias apps
       (LinkedIn, iMessage...) no resuelven una ruta relativa y se quedan
       sin imagen. -->
  <meta property="og:title" content="Tu Nombre — Índice personal">
  <meta property="og:description" content="DESARROLLO SOFTWARE · INGENIERÍA & SISTEMAS">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Tu Nombre / Alias">
  <meta property="og:locale" content="es_ES">
  <meta property="og:image" content="https://tu-dominio.example/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Índice personal de Tu Nombre / Alias">
  <meta property="og:url" content="https://tu-dominio.example/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tu Nombre — Índice personal">
  <meta name="twitter:description" content="DESARROLLO SOFTWARE · INGENIERÍA & SISTEMAS">
  <meta name="twitter:image" content="https://tu-dominio.example/og-image.png">
  <meta name="twitter:image:alt" content="Índice personal de Tu Nombre / Alias">
  <link rel="canonical" href="https://tu-dominio.example/">

  <!-- Icons & PWA -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=5">
  <!-- Fallback clásico: navegadores/crawlers viejos piden /favicon.ico por
       defecto aunque haya un <link rel="icon"> más moderno; sin este archivo
       esa petición cae en 404. -->
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Sin fuentes externas: usa la pila tipográfica nativa del sistema (ver style.css) -->
  <link rel="stylesheet" href="style.css">

  <!-- Evita el parpadeo de tema al recargar cuando hay una preferencia manual
       guardada. Externo (no inline) para que la CSP de nginx.conf pueda ser
       estricta (script-src 'self', sin "unsafe-inline"). -->
  <script src="theme-init.js"></script>

  <!-- Datos estructurados schema.org. Van INLINE a propósito: Google
       ignora el atributo "src" en un bloque ld+json, tiene que estar
       aquí escrito. Lo rellena sync-meta.js desde config.js; lo de abajo
       es solo la plantilla genérica. Un bloque de datos ld+json no lo
       ejecuta el navegador, así que la CSP estricta de nginx.conf
       (script-src 'self', sin unsafe-inline) no lo bloquea. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Tu Nombre / Alias",
    "description": "DESARROLLO SOFTWARE · INGENIERÍA & SISTEMAS",
    "url": "https://tu-dominio.example/",
    "inLanguage": "es"
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#index">Saltar al índice de proyectos</a>

  <div class="page">

    <!-- Masthead: identidad, tema y contacto -->
    <aside class="masthead">
      <div class="masthead-top">
        <span class="flag status-disponible" id="status-flag">
          <span class="flag-dot" aria-hidden="true"></span>
          <span class="flag-text">DISPONIBLE</span>
        </span>

        <button id="theme-toggle" class="theme-toggle" data-state="auto" aria-label="Cambiar modo claro / oscuro" title="Cambiar tema">
          <span class="theme-dial" aria-hidden="true"></span>
          <span id="theme-label">AUTO</span>
        </button>
      </div>

      <div class="identity">
        <p class="identity-kicker">
          <span id="kicker-text">ÍNDICE PERSONAL</span>
        </p>
        <h1 class="identity-name" id="operator-name">Tu Nombre / Alias</h1>
        <p class="identity-role" id="operator-subtitle">DESARROLLO SOFTWARE // INGENIERÍA &amp; SISTEMAS</p>
      </div>

      <div class="contact-block" id="contact-block">
        <span class="contact-kicker">CONTACTO</span>
        <a href="mailto:contacto@ejemplo.com" class="contact-email" id="contact-email-link">
          <span id="contact-email-text">contacto@ejemplo.com</span>
        </a>
        <button id="copy-email-btn" class="copy-btn" aria-label="Copiar correo al portapapeles">
          <span id="copy-btn-text">Copiar dirección</span>
        </button>
        <span class="visually-hidden" id="copy-status" role="status" aria-live="polite"></span>
      </div>

      <p class="masthead-footer">
        <span aria-hidden="true">·</span> Actualizado <span id="sync-timestamp">—</span>
      </p>
    </aside>

    <!-- Índice de proyectos y enlaces. -->
    <main class="index" id="index" aria-label="Proyectos y enlaces">
      <div class="index-head">
        <span class="index-head-number" aria-hidden="true">N°</span>
        <span class="index-head-title" id="content-title" tabindex="-1">PROYECTOS Y ENLACES</span>
      </div>

      <!-- Página estática (ver style.css, @media 860px arriba): esta es la
           ÚNICA parte de todo el sitio que hace scroll — la entradilla y
           el título de arriba no se mueven nunca. Las filas se desvanecen
           (mask-image, no un bloque de color) al acercarse al borde
           superior, y en cuanto quedan aunque sea mínimamente tapadas
           script.js las marca no-clicables de verdad (ver
           initListFadeGuard) — no solo visualmente ocultas. -->
      <div class="index-scroll" id="index-scroll">
        <ol class="index-list" id="content-list">
          <!-- Se inserta dinámicamente desde config.js / script.js (UNITS). -->
        </ol>
      </div>

      <!-- Alternativa accesible para navegadores/crawlers sin JavaScript. -->
      <noscript>
        <ol class="index-list">
          <li class="index-row">
            <a class="index-link" href="https://ejemplo.com" target="_blank" rel="noopener noreferrer">
              <span class="row-number">01</span>
              <span class="row-body">
                <span class="row-head">
                  <span class="row-name">PROYECTO EJEMPLO</span>
                  <span class="row-flag status-activo"><span class="flag-dot"></span>ACTIVO</span>
                </span>
                <span class="row-desc">Descripción del proyecto o plataforma en producción.</span>
              </span>
              <span class="row-url">ejemplo.com →</span>
            </a>
          </li>
          <li class="index-row">
            <a class="index-link" href="https://github.com/tuusuario" target="_blank" rel="noopener noreferrer">
              <span class="row-number">02</span>
              <span class="row-body">
                <span class="row-head">
                  <span class="row-name">GITHUB</span>
                  <span class="row-flag status-activo"><span class="flag-dot"></span>REPOSITORIO</span>
                </span>
                <span class="row-desc">Código, herramientas y proyectos open source.</span>
              </span>
              <span class="row-url">github.com/tuusuario →</span>
            </a>
          </li>
        </ol>
        <p class="row-desc">¿Tienes alguna duda? Escribe directamente a <a href="mailto:contacto@ejemplo.com">contacto@ejemplo.com</a>.</p>
      </noscript>
    </main>

  </div>

  <footer class="credit">
    <a href="https://github.com/tronarite/kardex" target="_blank" rel="noopener noreferrer">Powered by Kardex</a>
  </footer>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
