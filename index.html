<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>ADVANCED LINK PORTFOLIO // DEV_HUB</title>
  <meta name="description" content="Hub personal y directorio de enlaces y proyectos con estética técnica minimalista.">
  <meta name="theme-color" content="#F6F7F9">
  
  <!-- Open Graph -->
  <meta property="og:title" content="ADVANCED LINK PORTFOLIO">
  <meta property="og:description" content="Hub personal y directorio de proyectos moderno y minimalista.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="favicon.svg">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Google Fonts: JetBrains Mono & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Subtle Technical Grid Overlay -->
  <div class="grid-overlay" aria-hidden="true"></div>

  <!-- Main Container -->
  <div class="terminal-shell">
    
    <!-- Top Bar -->
    <header class="terminal-header">
      
      <!-- Top Meta Readout -->
      <div class="sys-meta">
        <div class="sys-status">
          <span class="status-pulse" aria-hidden="true"></span>
          <span class="status-text">DISPONIBLE</span>
        </div>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Cambiar modo claro / oscuro" title="Cambiar tema">
          <span id="theme-icon" class="theme-icon" aria-hidden="true">◐</span>
          <span id="theme-label" class="theme-label">TEMA</span>
        </button>
      </div>

      <!-- Hero / Name & Presentation -->
      <div class="operator-block">
        <div class="boot-line">
          <span class="bracket-tag">[</span>
          <h1 id="operator-name" class="operator-title" aria-label="DEV_HUB">DEV_HUB</h1>
          <span class="cursor" id="boot-cursor" aria-hidden="true">_</span>
          <span class="bracket-tag">]</span>
        </div>
        <div class="operator-author" id="operator-author">Tu Nombre / Alias</div>
        <p class="operator-sub" id="operator-subtitle">
          DESARROLLO SOFTWARE <span class="sep">//</span> INGENIERÍA & SISTEMAS
        </p>
      </div>

      <!-- Section Divider -->
      <div class="tech-divider" aria-hidden="true">
        <span class="tech-line"></span>
        <span class="tech-label">PROYECTOS Y ENLACES</span>
        <span class="tech-line"></span>
      </div>
    </header>

    <!-- Projects Grid / Units List -->
    <main id="units-container" class="units-wrapper" role="region" aria-label="Proyectos y Enlaces">
      
      <!-- Injected dynamically via script.js -->
      <div id="units-list" class="units-list" role="list"></div>

      <!-- Accessible fallback for disabled JS / crawlers -->
      <noscript>
        <div class="units-list fallback" role="list">
          <article class="unit-card" role="listitem">
            <a href="https://ejemplo.com" target="_blank" rel="noopener noreferrer" class="unit-link">
              <div class="unit-header">
                <div class="unit-designation">
                  <span class="unit-code">01</span>
                  <span class="unit-sep">::</span>
                  <span class="unit-name">PROYECTO EJEMPLO</span>
                </div>
                <div class="unit-badge online">
                  <span class="indicator-dot"></span>
                  <span class="badge-label">[ONLINE]</span>
                </div>
              </div>
              <p class="unit-desc">Descripción del proyecto o plataforma en producción.</p>
              <div class="unit-footer">
                <span class="unit-url">→ ejemplo.com</span>
              </div>
            </a>
          </article>

          <article class="unit-card" role="listitem">
            <a href="https://foto.ejemplo.com" target="_blank" rel="noopener noreferrer" class="unit-link">
              <div class="unit-header">
                <div class="unit-designation">
                  <span class="unit-code">02</span>
                  <span class="unit-sep">::</span>
                  <span class="unit-name">PORTFOLIO FOTOGRÁFICO</span>
                </div>
                <div class="unit-badge building">
                  <span class="indicator-dot"></span>
                  <span class="badge-label">[EN DESARROLLO]</span>
                </div>
              </div>
              <p class="unit-desc">Galería fotográfica y archivos visuales personales.</p>
              <div class="unit-footer">
                <span class="unit-url">→ foto.ejemplo.com</span>
              </div>
            </a>
          </article>

          <article class="unit-card" role="listitem">
            <a href="https://github.com/tuusuario" target="_blank" rel="noopener noreferrer" class="unit-link">
              <div class="unit-header">
                <div class="unit-designation">
                  <span class="unit-code">03</span>
                  <span class="unit-sep">::</span>
                  <span class="unit-name">GITHUB</span>
                </div>
                <div class="unit-badge source">
                  <span class="indicator-dot"></span>
                  <span class="badge-label">[REPOSITORIO]</span>
                </div>
              </div>
              <p class="unit-desc">Código, herramientas y proyectos open source.</p>
              <div class="unit-footer">
                <span class="unit-url">→ github.com/tuusuario</span>
              </div>
            </a>
          </article>

          <article class="unit-card" role="listitem">
            <a href="https://www.last.fm/user/tuusuario" target="_blank" rel="noopener noreferrer" class="unit-link">
              <div class="unit-header">
                <div class="unit-designation">
                  <span class="unit-code">04</span>
                  <span class="unit-sep">::</span>
                  <span class="unit-name">LAST.FM</span>
                </div>
                <div class="unit-badge media">
                  <span class="indicator-dot"></span>
                  <span class="badge-label">[MÚSICA]</span>
                </div>
              </div>
              <p class="unit-desc">Historial musical y estadísticas en tiempo real.</p>
              <div class="unit-footer">
                <span class="unit-url">→ last.fm/user/tuusuario</span>
              </div>
            </a>
          </article>
        </div>
      </noscript>
    </main>

    <!-- Contact Section -->
    <section class="contact-section" aria-label="Contacto">
      <div class="contact-card">
        <div class="contact-info">
          <span class="contact-label">CONTACTO</span>
          <a href="mailto:contacto@ejemplo.com" class="contact-email" id="contact-email-link">
            <span class="email-icon" aria-hidden="true">✉</span>
            <span class="email-text" id="contact-email-text">contacto@ejemplo.com</span>
          </a>
        </div>
        <button id="copy-email-btn" class="copy-btn" title="Copiar correo al portapapeles" aria-label="Copiar correo">
          <span id="copy-btn-text">Copiar</span>
        </button>
      </div>
    </section>

    <!-- Footer Status Log -->
    <footer class="terminal-footer">
      <div class="footer-divider" aria-hidden="true"></div>
      <div class="footer-content">
        <div class="log-entry">
          <span class="log-prompt">&gt;</span>
          <span class="log-title">ÚLTIMA SINCRONIZACIÓN:</span>
          <span id="sync-timestamp" class="log-time">CARGANDO...</span>
        </div>
        <div class="footer-sysinfo">
          <span class="proto-tag">PORTFOLIO // ACTIVO</span>
        </div>
      </div>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
